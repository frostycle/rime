name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./packages/rime/package.json').version")" = "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @frostycle/rime exec playwright install --with-deps chromium webkit firefox

      - run: pnpm check

      - run: pnpm test:unit

      - run: pnpm test:browser

      # The trusted publisher on npm grants only `npm stage publish` (needs npm 11.19+): a plain
      # `npm publish` is refused with 403. npm, not pnpm, because npm exchanges the OIDC token.
      - run: npm install -g npm@11.19.0

      - name: Stage the publish for approval on npmjs.com
        working-directory: packages/rime
        run: npm stage publish .
